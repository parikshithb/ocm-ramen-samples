apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
  labels:
    appname: busybox
spec:
  replicas: 1
  selector:
    matchLabels:
      appname: busybox
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        appname: busybox
    spec:
      initContainers:
      - name: init-integrity-check
        image: quay.io/ocsci/rdr-ocs-workload
        command: ['sh', '-c']
        args:
        - wget https://raw.githubusercontent.com/red-hat-storage/ocs-workloads/master/rdr/busybox/scripts/simple_io_integrity_check.sh \
             -O /mnt/test/simple_io_integrity_check.sh;
          chmod +x /mnt/test/simple_io_integrity_check.sh;
          /mnt/test/simple_io_integrity_check.sh
        volumeMounts:
        - mountPath: /mnt/test
          name: mypvc
      containers:
      - name: busybox
        image: quay.io/ocsci/rdr-ocs-workload
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - wget https://raw.githubusercontent.com/red-hat-storage/ocs-workloads/master/rdr/busybox/scripts/simple_io.sh \
                -O /mnt/test/simple_io.sh;
            wget https://raw.githubusercontent.com/red-hat-storage/ocs-workloads/master/rdr/busybox/scripts/simple_io_integrity_check.sh \
                -O /mnt/test/simple_io_integrity_check.sh;
            chmod +x /mnt/test/simple_io.sh; chmod +x /mnt/test/simple_io_integrity_check.sh;
            /mnt/test/simple_io.sh
        env:
        - name: IO_SCRIPT
          value: "/mnt/test/simple_io.sh"
        - name: DATA_INTEGRITY_SCRIPT
          value: "/mnt/test/simple_io_integrity_check.sh"
        volumeMounts:
        - mountPath: /mnt/test
          name: mypvc
      volumes:
      - name: mypvc
        persistentVolumeClaim:
          claimName: busybox-pvc
